[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drawai"
version = "0.1.0"
description = "Standalone image-to-editable-SVG/PPTX reconstruction pipeline."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "DrawAI Maintainers" },
]
keywords = ["drawai", "layout-ir", "svg", "pptx", "ocr", "sam", "scientific-figures"]
dependencies = [
    "cairosvg>=2.9.0",
    "claude-agent-sdk>=0.2.119",
    "fastapi>=0.116.0",
    "lxml>=6.1.0",
    "numpy",
    "openai",
    "openai-codex",
    "pillow",
    "pydantic<2.14",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "pyyaml",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
evaluation = [
    "huggingface-hub>=1.7,<2",
    "openai-codex==0.1.0b3",
    "opencv-python-headless==4.13.0.92",
    "scikit-image==0.26.0",
]
local-runtime = [
    "paddlepaddle",
    "safetensors",
    "torch",
    "transformers",
]
dev = [
    "httpx",
    "pytest",
]

[project.scripts]
drawai = "drawai.cli:main"
drawai-explainer = "drawai.explainer_app:main"
drawai-local-services = "drawai.local_services:main"
drawai-workbench-api = "drawai.workbench.api:main"
drawai-dataset = "drawai_evaluation.dataset:main"
drawai-evaluate = "drawai_evaluation.batch:main"
drawai-rubric = "drawai_evaluation.rubric:main"
drawai-merge = "drawai_evaluation.merge:main"
drawai-scores = "drawai_evaluation.scores:main"

[tool.uv]
prerelease = "allow"

[tool.hatch.build.targets.wheel]
packages = ["src/drawai", "src/drawai_evaluation"]
